<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" fill="none">
  <!-- Stylesheet for typography -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap');
    
    .title-main {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 20px;
      font-weight: 900;
      fill: #111111;
      letter-spacing: -0.5px;
    }
    .monospace-header {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #9e9b95;
      letter-spacing: 1.5px;
    }
    .monospace-label {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #007acc;
      letter-spacing: 1px;
    }
    .monospace-boundary-label {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #a8a59e;
      letter-spacing: 2px;
    }
    .node-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #111111;
    }
    .node-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #5c5a54;
      line-height: 15px;
    }
    .node-bullet {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #007acc;
    }
    .wireframe-box {
      stroke: #e0ded9;
      stroke-width: 1.5;
      fill: #ffffff;
      rx: 8;
    }
    .wireframe-box-accent {
      stroke: #007acc;
      stroke-width: 2;
      fill: #ffffff;
      rx: 8;
      filter: drop-shadow(0px 4px 12px rgba(0, 122, 204, 0.04));
    }
    .connection-line {
      stroke: #007acc;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .connection-line-dashed {
      stroke: #9e9b95;
      stroke-width: 1.5;
      stroke-dasharray: 4,4;
      fill: none;
    }
    .connector-dot {
      fill: #007acc;
    }
    .connector-dot-dashed {
      fill: #9e9b95;
    }
  </style>

  <!-- Definitions for pattern grid and markers -->
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e2dfd9" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007acc" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9e9b95" />
    </marker>
  </defs>

  <!-- Warm off-white technical paper background -->
  <rect width="1000" height="550" fill="#faf9f5" />
  
  <!-- Technical Dotted Grid Overlay -->
  <rect width="1000" height="550" fill="url(#dotGrid)" />

  <!-- Sheet Frame Border (Blueprint style) -->
  <rect x="8" y="8" width="984" height="534" rx="6" fill="none" stroke="#e0ded9" stroke-width="1" />
  <rect x="12" y="12" width="976" height="526" rx="4" fill="none" stroke="#e0ded9" stroke-width="1.5" />

  <!-- Top Header Bar Schematic Details -->
  <line x1="24" y1="45" x2="976" y2="45" stroke="#e0ded9" stroke-width="1.5" />
  <text x="28" y="35" class="monospace-header">FIG_002 // RENDERPAGE ARCHITECTURE PIPELINE</text>
  <text x="972" y="35" class="monospace-header" text-anchor="end">v1.0.0</text>

  <!-- ==================== LOCAL SECURITY BOUNDARY ==================== -->
  <!-- Enclosure Box for Secure Environment -->
  <rect x="24" y="65" width="952" height="460" rx="6" fill="none" stroke="#e0ded9" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="24" y="65" width="460" height="24" rx="0" fill="#faf9f5" />
  <text x="36" y="80" class="monospace-boundary-label">[ SECURE LOCAL ENVIRONMENT - ZERO TELEMETRY ]</text>

  <!-- ==================== STAGE 1: INPUT ==================== -->
  <g transform="translate(50, 110)">
    <rect width="210" height="110" class="wireframe-box" />
    <!-- File Icon -->
    <path d="M 20 20 L 35 20 L 45 30 L 45 45 L 20 45 Z" stroke="#007acc" stroke-width="1.5" fill="none" />
    <path d="M 35 20 L 35 30 L 45 30" stroke="#007acc" stroke-width="1.5" fill="none" />
    <text x="55" y="27" class="monospace-label">01 // SOURCE INPUT</text>
    <text x="55" y="42" class="node-title">Jupyter Notebook</text>
    
    <text x="20" y="70" class="node-text">Loads the standard .ipynb JSON</text>
    <text x="20" y="86" class="node-text">file containing raw Markdown,</text>
    <text x="20" y="102" class="node-text">LaTeX, code cells, and base64 plots.</text>
  </g>

  <!-- ==================== STAGE 2: PARSING ENGINE ==================== -->
  <g transform="translate(320, 110)">
    <rect width="280" height="385" class="wireframe-box-accent" />
    <!-- Gear Icon -->
    <circle cx="32" cy="30" r="8" stroke="#007acc" stroke-width="2" fill="none" />
    <path d="M 32 18 L 32 22 M 32 38 L 32 42 M 20 30 L 24 30 M 40 30 L 44 30" stroke="#007acc" stroke-width="2" />
    <text x="55" y="27" class="monospace-label">02 // PARSING &amp; COMPILATION</text>
    <text x="55" y="42" class="node-title">RenderPage Parser Engine</text>
    
    <text x="20" y="72" class="node-text">The VS Code extension logic processes</text>
    <text x="20" y="88" class="node-text">and formats all notebook structures:</text>
    
    <!-- Marked.js -->
    <rect x="20" y="108" width="240" height="50" rx="4" fill="#faf9f5" stroke="#e0ded9" stroke-width="1" />
    <text x="32" y="126" class="monospace-label" fill="#111111">Marked Parser</text>
    <text x="32" y="142" class="node-text" font-size="11">Compiles markdown cells into clean HTML</text>

    <!-- KaTeX -->
    <rect x="20" y="170" width="240" height="50" rx="4" fill="#faf9f5" stroke="#e0ded9" stroke-width="1" />
    <text x="32" y="188" class="monospace-label" fill="#111111">KaTeX Offline Bundle</text>
    <text x="32" y="206" class="node-text" font-size="11">Pre-renders LaTeX math ($E=mc²) quickly</text>

    <!-- Prism.js -->
    <rect x="20" y="232" width="240" height="50" rx="4" fill="#faf9f5" stroke="#e0ded9" stroke-width="1" />
    <text x="32" y="250" class="monospace-label" fill="#111111">Prism.js Syntax Engine</text>
    <text x="32" y="268" class="node-text" font-size="11">Formats Python syntax highlighting</text>

    <!-- Slate CSS -->
    <rect x="20" y="294" width="240" height="50" rx="4" fill="#faf9f5" stroke="#e0ded9" stroke-width="1" />
    <text x="32" y="312" class="monospace-label" fill="#111111">Slate Theme Custom CSS</text>
    <text x="32" y="330" class="node-text" font-size="11">Applies margins, page number headers</text>

    <text x="20" y="365" class="node-text" font-size="11" fill="#9e9b95">• Packages and injects all assets offline.</text>
  </g>

  <!-- ==================== STAGE 3: INTERMEDIATE HTML ==================== -->
  <g transform="translate(640, 110)">
    <rect width="240" height="110" class="wireframe-box" />
    <!-- HTML Icon -->
    <rect x="20" y="20" width="22" height="24" rx="2" stroke="#007acc" stroke-width="1.5" fill="none" />
    <path d="M 24 32 L 28 28 L 24 24 M 38 32 L 34 28 L 38 24" stroke="#007acc" stroke-width="1.5" fill="none" />
    <text x="55" y="27" class="monospace-label">03 // INTERMEDIATE</text>
    <text x="55" y="42" class="node-title">Bundled Static HTML</text>
    
    <text x="20" y="70" class="node-text">Creates a temporary, self-contained</text>
    <text x="20" y="86" class="node-text">HTML file containing all injected assets,</text>
    <text x="20" y="102" class="node-text">code highlighting, and document headers.</text>
  </g>

  <!-- ==================== STAGE 4: CHROMIUM PRINT ==================== -->
  <g transform="translate(640, 260)">
    <rect width="240" height="110" class="wireframe-box" />
    <!-- Globe/Terminal Icon -->
    <rect x="20" y="22" width="24" height="20" rx="3" stroke="#007acc" stroke-width="1.5" fill="none" />
    <circle cx="27" cy="27" r="2" fill="#007acc" />
    <circle cx="37" cy="27" r="2" fill="#007acc" />
    <text x="55" y="27" class="monospace-label">04 // BROWSER PRINT</text>
    <text x="55" y="42" class="node-title">Headless Chromium</text>
    
    <text x="20" y="70" class="node-text">Launches the local system browser</text>
    <text x="20" y="86" class="node-text">(Chrome/Edge/Brave) completely offline</text>
    <text x="20" y="102" class="node-text">to print the static HTML to a PDF.</text>
  </g>

  <!-- ==================== STAGE 5: OUTPUT PDF ==================== -->
  <g transform="translate(640, 410)">
    <rect width="240" height="85" class="wireframe-box-accent" />
    <!-- PDF Badge Icon -->
    <rect x="20" y="20" width="24" height="26" rx="2" stroke="#007acc" stroke-width="1.5" fill="none" />
    <line x1="24" y1="36" x2="40" y2="36" stroke="#007acc" stroke-width="1.5" />
    <text x="55" y="27" class="monospace-label">05 // OUTPUT GENERATED</text>
    <text x="55" y="42" class="node-title">Portable Doc Format :)</text>
    
    <text x="20" y="66" class="node-text">Clean, formatted, offline PDF ready.</text>
  </g>

  <!-- ==================== SCHEMATIC CONNECTION LINES ==================== -->
  
  <!-- Path 1: Stage 1 to Stage 2 -->
  <path d="M 260,165 L 320,165" class="connection-line" marker-end="url(#arrow)" />
  <circle cx="260" cy="165" r="3.5" class="connector-dot" />

  <!-- Path 2: Stage 2 to Stage 3 -->
  <path d="M 580,165 L 640,165" class="connection-line" marker-end="url(#arrow)" />
  <circle cx="580" cy="165" r="3.5" class="connector-dot" />

  <!-- Path 3: Stage 3 to Stage 4 -->
  <path d="M 755,220 L 755,260" class="connection-line" marker-end="url(#arrow)" />
  <circle cx="755" cy="220" r="3.5" class="connector-dot" />

  <!-- Path 4: Stage 4 to Stage 5 -->
  <path d="M 755,370 L 755,410" class="connection-line" marker-end="url(#arrow)" />
  <circle cx="755" cy="370" r="3.5" class="connector-dot" />

  <!-- Path 5: Dash control line from Stage 2 Parser down and into Stage 4 Launcher -->
  <!-- This represents the programmatic launch signals sent to chrome -->
  <path d="M 580,452 L 620,452 L 620,315 L 640,315" class="connection-line-dashed" marker-end="url(#arrow-dashed)" />
  <circle cx="580" cy="452" r="3" class="connector-dot-dashed" />
  <text x="600" y="400" transform="rotate(-90 600 385)" class="monospace-label" fill="#9e9b95" text-anchor="middle" font-size="8">CLI EXEC LAUNCH</text>
</svg>
