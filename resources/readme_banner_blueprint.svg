<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <!-- Stylesheet for typography -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap');
    .title-blue {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 62px;
      font-weight: 900;
      fill: #007acc;
      letter-spacing: -2px;
    }
    .title-dark {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 62px;
      font-weight: 900;
      fill: #111111;
      letter-spacing: -2px;
    }
    .description {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #5c5a54;
    }
    .monospace-meta {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #007acc;
      letter-spacing: 2px;
    }
    .monospace-header {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #9e9b95;
      letter-spacing: 1.5px;
    }
    .monospace-label {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #111111;
    }
    .wireframe-diamond {
      stroke: #007acc;
      stroke-width: 2.5;
      transition: all 0.3s ease;
    }
  </style>

  <!-- Definitions for pattern grid and markers -->
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e2dfd9" />
    </pattern>
  </defs>

  <!-- Warm off-white technical paper background -->
  <rect width="1280" height="420" fill="#faf9f5" />
  
  <!-- Technical Dotted Grid Overlay -->
  <rect width="1280" height="420" fill="url(#dotGrid)" />

  <!-- Sheet Frame Border (Blueprint style) -->
  <rect x="8" y="8" width="1264" height="404" rx="6" fill="none" stroke="#e0ded9" stroke-width="1" />
  <rect x="12" y="12" width="1256" height="396" rx="4" fill="none" stroke="#e0ded9" stroke-width="1.5" />

  <!-- Top Header Bar Schematic Details -->
  <line x1="24" y1="45" x2="1256" y2="45" stroke="#e0ded9" stroke-width="1.5" />
  <text x="28" y="35" class="monospace-header">FIG_001 // RENDERPAGE SYSTEM SCHEMATIC</text>
  <text x="1252" y="35" class="monospace-header" text-anchor="end">© 2026 • OPEN SOURCE • LOCAL PDF ENGINE</text>

  <!-- ==================== LEFT PANEL: ISOMETRIC WIREFRAME PIPELINE STACK ==================== -->
  
  <!-- Stack Center X = 360, spacing Y = 70 -->
  <!-- Vertical wireframe corners connecting layers (isometric 3D cage effect) -->
  <line x1="250" y1="115" x2="250" y2="325" stroke="#007acc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="470" y1="115" x2="470" y2="325" stroke="#007acc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="360" y1="60" x2="360" y2="270" stroke="#007acc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="360" y1="170" x2="360" y2="380" stroke="#007acc" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Layer 1 (Bottom): FINISHED PDF (cy = 325) -->
  <polygon points="360,270 470,325 360,380 250,325" class="wireframe-diamond" fill="rgba(0, 122, 204, 0.03)" />
  <line x1="250" y1="325" x2="175" y2="325" stroke="#007acc" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="250" cy="325" r="3.5" fill="#007acc" />
  <circle cx="175" cy="325" r="3.5" fill="#007acc" />
  <text x="160" y="329" class="monospace-label" text-anchor="end">04 FINISHED PDF</text>

  <!-- Layer 2: LOCAL ENGINE / CHROMIUM (cy = 255) -->
  <polygon points="360,200 470,255 360,310 250,255" class="wireframe-diamond" fill="rgba(0, 122, 204, 0.05)" />
  <line x1="250" y1="255" x2="175" y2="255" stroke="#007acc" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="250" cy="255" r="3.5" fill="#007acc" />
  <circle cx="175" cy="255" r="3.5" fill="#007acc" />
  <text x="160" y="259" class="monospace-label" text-anchor="end">03 LOCAL ENGINE</text>

  <!-- Layer 3: KATEX & PRISMJS / ASSET BUNDLERS (cy = 185) -->
  <polygon points="360,130 470,185 360,240 250,185" class="wireframe-diamond" fill="rgba(0, 122, 204, 0.07)" />
  <line x1="250" y1="185" x2="175" y2="185" stroke="#007acc" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="250" cy="185" r="3.5" fill="#007acc" />
  <circle cx="175" cy="185" r="3.5" fill="#007acc" />
  <text x="160" y="189" class="monospace-label" text-anchor="end">02 KATEX &amp; PRISMJS</text>

  <!-- Layer 4 (Top): .IPYNB JSON PARSER (cy = 115) -->
  <polygon points="360,60 470,115 360,170 250,115" class="wireframe-diamond" fill="rgba(0, 122, 204, 0.09)" />
  <line x1="250" y1="115" x2="175" y2="115" stroke="#007acc" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="250" cy="115" r="3.5" fill="#007acc" />
  <circle cx="175" cy="115" r="3.5" fill="#007acc" />
  <text x="160" y="119" class="monospace-label" text-anchor="end">01 .IPYNB JSON</text>


  <!-- ==================== RIGHT PANEL: BOLD SCHEMATIC TYPOGRAPHY ==================== -->
  
  <g transform="translate(530, 0)">
    <!-- Big Headline Title: RENDERPAGE PDF FROM SCRATCH. -->
    <text x="0" y="145" class="title-blue">RENDERPAGE</text>
    <text x="0" y="210" class="title-dark">PDF FROM NOTEBOOK.</text>
    
    <!-- Thin technical divider segment -->
    <line x1="0" y1="235" x2="710" y2="235" stroke="#e0ded9" stroke-width="1.5" />

    <!-- Subtitle description block -->
    <text x="0" y="270" class="description">A local VS Code extension that compiles Jupyter Notebooks (.ipynb) to</text>
    <text x="0" y="295" class="description">publication-quality PDFs offline.</text>

    <!-- Bottom Metadata statistics row -->
    <text x="0" y="360" class="monospace-meta">v1.0.0  •  100% LOCAL  •  ZERO TELEMETRY</text>
  </g>
</svg>
